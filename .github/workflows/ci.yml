name: CI

# The engine needs Slay the Spire 2's DLLs, which cannot be stored in the repository or in
# CI. This workflow runs what works without them: lint, the engine-free tests (tests that need
# the game are skipped automatically) and the builds of the stubs and audit tools. The full
# suite runs on a self-hosted runner with the game installed (see README, "Tests and CI").

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Python tools
        run: python -m pip install pytest pyflakes

      - name: Lint
        run: python -m pyflakes python tools tests agent scripts

      - name: Shell syntax
        run: bash -n setup.sh

      - name: Build GodotStubs and audit tools
        run: |
          dotnet build src/GodotStubs/GodotStubs.csproj
          dotnet build tools/GodotStubAudit/GodotStubAudit.csproj
          dotnet build tools/GodotStubDiff/GodotStubDiff.csproj
          dotnet build tools/TestModeAudit/TestModeAudit.csproj

      - name: Engine-free tests
        run: python -m pytest tests -q
